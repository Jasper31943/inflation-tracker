const DZ=window.CPI_DATA;DZ.items.forEach(it=>{if(it.key=='便當')it.key='三餐'});const DU=window.CPI_DATA_US||{items:[]};let D=DZ;const sel={},IC={"三餐": "<rect x=\"3\" y=\"7\" width=\"18\" height=\"12\" rx=\"2\"/><path d=\"M3 11h18M12 11v8\"/>", "飲料": "<path d=\"M6 8h12l-1.5 13h-9z\"/><path d=\"M5 8h14M13 8l2-6\"/>", "咖啡": "<path d=\"M4 9h13v6a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z\"/><path d=\"M17 11h1.5a2.5 2.5 0 0 1 0 5H17M8 3v3M12 3v3\"/>", "房租": "<path d=\"M3 11l9-7 9 7\"/><path d=\"M5 10v10h14V10M10 20v-6h4v6\"/>", "油錢": "<path d=\"M4 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16M3 21h12M4 10h10\"/><path d=\"M14 8h2a2 2 0 0 1 2 2v6a1.5 1.5 0 0 0 3 0V8l-3-3\"/>", "大眾運輸": "<rect x=\"5\" y=\"3\" width=\"14\" height=\"14\" rx=\"3\"/><path d=\"M5 11h14M8 20l2-3M16 20l-2-3\"/><circle cx=\"9\" cy=\"14\" r=\".6\"/><circle cx=\"15\" cy=\"14\" r=\".6\"/>", "日用品": "<path d=\"M8 3h8v4H8zM7 7h10l1 14H6z\"/><path d=\"M9 12h6\"/>", "水電瓦斯": "<path d=\"M9 18h6M10 21h4\"/><path d=\"M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z\"/>"};
Object.assign(IC,{"Groceries":"<path d=\"M3 4h2l2.2 10.5a1.5 1.5 0 0 0 1.5 1.2h8.6a1.5 1.5 0 0 0 1.5-1.1L20 8H6.2\"/><circle cx=\"9.5\" cy=\"19.5\" r=\"1.3\"/><circle cx=\"16.5\" cy=\"19.5\" r=\"1.3\"/>","Dining out":"<path d=\"M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10\"/><path d=\"M17 21V3c-2 1.5-3 4-3 7s1 3.5 3 4\"/>","Rent":IC["房租"],"Gas":IC["油錢"],"Public transit":IC["大眾運輸"],"Household goods":"<path d=\"M10 3h4v3h-4zM9 6h6l2 4v11H7V10z\"/><path d=\"M7 14h10\"/>","Utilities":IC["水電瓦斯"]});
const svg=k=>`<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${IC[k]||IC[{'便當':'三餐'}[k]]||'<circle cx="12" cy="12" r="7"/>'}</svg>`;
let lastI=null;function markChips(){document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',+c.dataset.v===sel[lastI]))}const CHU={"Groceries":[400,600,900],"Dining out":[150,300,500],"Rent":[1500,2000,2500],"Gas":[100,200,300],"Public transit":[50,100,150],"Household goods":[50,100,200],"Utilities":[100,200,300]};const CHZ={"三餐":[6000,9000,12000],"飲料":[500,1000,2000],"房租":[6000,10000,15000],"油錢":[500,1000,2000],"大眾運輸":[600,1200,2000],"日用品":[300,600,1000],"水電瓦斯":[800,1500,2500]};let CH=CHZ;
const money=n=>(EN()?'$':'NT$ ')+String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,',');
function drawBubbles(){$('#bubbles').innerHTML=D.items.map((it,i)=>{const on=sel[i]!=null,na=typeof it.rate!='number';return `<div class="bub ${on?'on':''} ${na?'na':''} ${i==lastI?'cur':''}" data-i="${i}"><div class="ball">${svg(it.key)}</div><div class="lbl">${lb(it.key)}${na?`<div class="sub" style="font-size:11px">${t().na}</div>`:''}</div></div>`}).join('');
 const n=Object.keys(sel).length;$('#go').disabled=!n;$('#go').textContent=n?t().go:t().pick;
 const p=$('#panel');if(lastI!=null&&sel[lastI]!=null){const k=D.items[lastI].key;p.classList.add('show');p.innerHTML=`<div class="plbl" style="display:flex;justify-content:space-between;align-items:center"><span>${t().q(lb(k))}</span><button class="btn" id="rm" style="padding:2px 12px;font-size:12px">${t().rm}</button></div><div style="display:flex;align-items:center;gap:8px"><span class="sub">${EN()?"$":"NT$"}</span><input id="amt" type="number" inputmode="numeric" pattern="[0-9]*" min="0" value="${sel[lastI]}" class="amt"></div><div class="chips">${(CH[k]||[]).map(v=>`<button class="chip" data-v="${v}">${v.toLocaleString()}</button>`).join('')}</div>`;
 $('#amt').oninput=e=>{sel[lastI]=Math.max(0,+e.target.value||0);markChips()};markChips();$('#rm').onclick=()=>{delete sel[lastI];lastI=null;drawBubbles()};
 p.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{sel[lastI]=+c.dataset.v;$('#amt').value=c.dataset.v;markChips()})}else{p.classList.remove('show');p.innerHTML=`<div class="plbl sub">${t().hint}</div>`}
 document.querySelectorAll('.bub .ball').forEach(b=>b.onclick=()=>{const i=+b.parentNode.dataset.i;if(typeof D.items[i].rate!='number')return;if(sel[i]==null)sel[i]=(CH[D.items[i].key]||[0,1000])[1];lastI=i;drawBubbles()})}
function compute(keep){
 const picked=Object.entries(sel).map(([i,w])=>({...D.items[i],w}));const ok=picked.filter(p=>typeof p.rate=='number');
 if(!ok.length){$('#out').innerHTML=t().nodata;return}
 const ok2=ok.filter(p=>p.w>0);if(!ok2.length){$('#out').innerHTML='<div class="glass warn"><div class="warntxt">'+t().zero+'</div></div>';return}ok.length=0;ok.push(...ok2);const W=ok.reduce((x,p)=>x+p.w,0),extra=ok.reduce((x,p)=>x+p.w-p.w/(1+p.rate/100),0),annual=ok.reduce((x,p)=>x+p.w*p.rate,0)/W,cpi=D.official;
 const wk=ok.filter(p=>typeof p.weight=='number'),cov=wk.length?wk.reduce((x,p)=>x+p.weight,0)/10:null;

 const cmp=!hasO?'':(Math.abs(diff)<=0.5?t().close(fmt(cpi)):diff>0?t().hi(fmt(cpi),diff.toFixed(1)):t().lo(fmt(cpi),(-diff).toFixed(1)));
 const list=[...ok].sort((a,b)=>b.rate-a.rate);const culprit=[...ok].sort((a,b)=>b.w*b.rate-a.w*a.rate)[0];const cul=culprit.rate>0?t().cul(lb(culprit.key),fmt(culprit.rate)):'';const culMe=culprit.rate>0?t().culMe(lb(culprit.key),fmt(culprit.rate)):'';
 $('#out').innerHTML=`<div class="hero"><div class="sub" style="font-size:20px">${t().mine}</div><div class="num ${cls}">${fmt(annual)}</div><div class="off" style="margin-top:12px">${cmp}</div><div style="margin-top:14px;font-size:clamp(16px,4.5vw,20px)">${extra>=0?t().more:t().less} <span class="money ${cls}">${money(Math.abs(extra))}</span></div>${cul?`<div style="margin-top:12px;font-size:clamp(16px,4.5vw,20px)">🔥 ${cul}</div>`:''}<div class="sub" style="margin-top:40px">${t().down}</div></div>
 <div class="glass"><b>${t().basis(ok.length,money(W))}</b><div class="sub" style="font-size:13px;margin-top:6px">${t().basisNote(D.period)}</div></div>
 <div class="glass"><b>${t().top}</b>${list.map(x=>`<div class="item"><span>${x.icon} ${lb(x.key)} <span class="sub" style="font-size:12px">${EN()?(CPIEN[x.cpi]||x.cpi):x.cpi}</span></span><span class="num ${x.rate>=0?'up':'down'}">${fmt(x.rate)}</span></div>`).join('')}</div>
 <div class="glass"><b>${t().inv}</b><div class="num" style="font-size:48px">${Math.max(annual,0).toFixed(1)}%</div><div class="sub">${t().invNote}</div></div>
 <div class="glass" style="text-align:center"><button class="btn primary" id="share">${t().share}</button><div id="img"></div></div>`;
 $('#share').onclick=()=>shareCard(annual,typeof cpi=='number'?cpi:NaN,culMe,extra);if(!keep)$('#out').scrollIntoView({behavior:'smooth'});
}
async function shareCard(annual,cpi,cul,extra){
 try{await Promise.all(['700 260px "Space Grotesk"','700 64px "Noto Sans TC"','400 56px "Noto Sans TC", sans-serif','700 64px "Inter"','400 56px "Inter"'].map(f=>document.fonts.load(f)))}catch(e){}
 const c=document.createElement('canvas');c.width=1080;c.height=1920;const x=c.getContext('2d');
 x.fillStyle='#0B0B1A';x.fillRect(0,0,1080,1920);x.filter='blur(120px)';
 [['#7C5CFF',200,350,420],['#FF4D8D',900,1500,460],['#22D3EE',600,900,300]].forEach(([col,cx,cy,r])=>{x.globalAlpha=.6;x.fillStyle=col;x.beginPath();x.arc(cx,cy,r,0,7);x.fill()});
 x.filter='none';x.globalAlpha=1;x.textAlign='center';x.fillStyle='#EEF';
 const F=t().F+', "Noto Sans TC", sans-serif';x.font='700 64px '+F;if(!EN())x.fillText(t().mine,540,760);
 const dd=isNaN(cpi)?annual:annual-cpi,col=isNaN(cpi)?(annual<0?'#2EE6A6':'#FF4D6D'):(dd>0.5?'#FF4D6D':(dd<-0.5?'#2EE6A6':'#C4B5FD'));x.shadowColor=col;x.shadowBlur=60;x.fillStyle=col;let fs=260;do{x.font='700 '+fs+'px "Space Grotesk", "Noto Sans TC", sans-serif';fs-=10}while(x.measureText(fmt(annual)).width>960&&fs>120);x.fillText(fmt(annual),540,1040);
 x.shadowBlur=0;x.fillStyle='#94A3B8';x.font='400 56px '+F;if(!isNaN(cpi))x.fillText(t().offc+fmt(cpi),540,1180);
 if(extra!=null){x.fillStyle='#fff';x.fillStyle=col;x.font='700 84px "Space Grotesk", "Noto Sans TC", sans-serif';if(EN()){x.font='400 48px '+F;x.fillStyle='#EEF';x.fillText(extra>=0?'I spend this much more per month:':'I spend this much less per month:',540,1290);x.fillStyle=col;x.font='700 96px "Space Grotesk", sans-serif';x.fillText(money(Math.abs(extra)),540,1400)}else x.fillText(extra>=0?'每月比去年多花 '+money(extra):'每月比去年少花 '+money(-extra),540,1300)}if(cul){x.fillStyle='#FFD3DB';x.font='700 52px '+F;if(EN()){const tw=x.measureText(cul).width,ic=56,g=16,x0=540-(tw+ic+g)/2,y=1510;x.textAlign='left';x.fillText(cul,x0+ic+g,y);x.save();x.translate(x0,y-46);x.scale(ic/24,ic/24);x.strokeStyle='#FF4D6D';x.lineWidth=1.8;x.lineCap='round';x.lineJoin='round';x.shadowColor='#FF4D6D';x.shadowBlur=12;x.stroke(new Path2D('M12 2.5c.5 3 4.5 5.5 4.5 10.5a4.5 4.5 0 0 1-9 0c0-2.2 1-3.6 2.2-4.6.1 1.8.9 3 2.1 3.4-.6-3.4-.4-6.4.2-9.3z'));x.restore();x.textAlign='center'}else x.fillText('🔥 '+cul,540,1400)}x.fillStyle='#EEF';x.font='700 44px '+F;x.fillText(t().brand,540,1750);if(t().foot){x.fillStyle='#94A3B8';x.font='400 30px '+F;x.fillText(t().foot,540,1680)}x.fillStyle='#94A3B8';x.font='400 36px "Space Grotesk", sans-serif';x.fillText('jasper31943.github.io/inflation-tracker'+(EN()?'/en':''),540,1820);

}
function render(){document.documentElement.lang=EN()?'en':'zh-Hant';document.title=t().title;$('#h1').innerHTML=t().h1;$('#subt').textContent=t().sub;$('#priv').innerHTML='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';$('#priv').append(t().priv);$('#src').textContent=D.source?t().src(D.source,D.period):'';document.body.classList.toggle('en7',D.items.length==7);
 document.querySelectorAll('#lt b').forEach(b=>b.classList.toggle('on',b.dataset.l==L));drawBubbles();if($('#out').innerHTML)compute(true)}
function setLang(l,save){const nd=l=='en'?DU:DZ;if(nd!==D){for(const k in sel)delete sel[k];lastI=null;$('#out').innerHTML=''}D=nd;CH=l=='en'?CHU:CHZ;L=l;if(save)try{localStorage.setItem('lang',l)}catch(e){}closeL();$('#lt').classList.remove('hide');render()}

$('#go').onclick=()=>compute();$('#lt').onclick=openL;$('#lx').onclick=closeL;$('#langscr').onclick=e=>{if(e.target.closest('.lc')||e.target.id=='lx')return;if(!e.target.closest('.lcards'))closeL()};document.addEventListener('keydown',e=>{if(e.key=='Escape')closeL()});

(()=>{const q=new URLSearchParams(location.search).get('lang');let st=null;try{st=localStorage.getItem('lang')}catch(e){}
 if(q=='en'||q=='zh')return setLang(q,true);if(st=='en'||st=='zh')return setLang(st,false);
