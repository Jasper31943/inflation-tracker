<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>體感通膨儀表板</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--up:#FF4D6D;--down:#2EE6A6;--off:#94A3B8;--amber:#FBBF24}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#0B0B1A;color:#EEF;font-family:"Noto Sans TC",sans-serif;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:#0B0B1A}.orb{position:absolute;width:520px;height:520px;border-radius:50%;filter:blur(120px);opacity:.55;z-index:0;animation:drift 22s ease-in-out infinite alternate}
.o1{background:#7C5CFF;top:-120px;left:-120px}.o2{background:#FF4D8D;bottom:-160px;right:-100px;animation-delay:-7s}.o3{background:#22D3EE;top:40%;left:45%;width:380px;height:380px;opacity:.35;animation-delay:-14s}
@keyframes drift{to{transform:translate(80px,60px) scale(1.15)}}
main{position:relative;z-index:1;max-width:760px;margin:auto;padding:48px 20px}
#upload{min-height:calc(100vh - 96px);display:flex;flex-direction:column;justify-content:center}#upload>*{align-self:stretch}#upload .pill{align-self:flex-start}
.glass{background:rgba(255,255,255,.06);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:24px;margin:18px 0;display:block;position:relative}
h1{font-weight:900;font-size:30px;margin:0 0 6px;word-break:keep-all}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.steps .glass{margin:0;padding:18px}.steps b{display:block;font-family:"Space Grotesk";font-size:28px;background:linear-gradient(90deg,#7C5CFF,#22D3EE);-webkit-background-clip:text;color:transparent}
@media (max-width:700px){.steps{grid-template-columns:1fr}}.sub{color:var(--off)}
.pill{display:inline-flex;gap:6px;align-items:center;background:rgba(46,230,166,.12);color:var(--down);border:1px solid rgba(46,230,166,.35);padding:6px 14px;border-radius:99px;font-size:14px}
.drop{text-align:center;padding:56px 24px;border:1.5px dashed rgba(255,255,255,.25);cursor:pointer;transition:.2s}
.drop:hover,.drop.over{border-color:#22D3EE;background:rgba(34,211,238,.08)}
.drop.err{border-color:var(--up);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.errmsg{color:var(--up);margin-top:10px;font-size:14px}
.btn{font:inherit;padding:10px 20px;border-radius:99px;cursor:pointer;border:1px solid rgba(255,255,255,.3);background:transparent;color:#EEF}
.btn.primary{background:linear-gradient(90deg,#7C5CFF,#FF4D8D);border:0}
input[type=number]{font:inherit;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:10px;padding:6px 10px;width:90px}
.num{font-family:"Space Grotesk",sans-serif;font-weight:700}
.hero{text-align:center;min-height:70vh;display:flex;flex-direction:column;justify-content:center}
.hero .num{font-size:clamp(64px,22vw,120px);line-height:1.1}.hero .sub:first-child{font-size:clamp(20px,6vw,26px)!important}.hero .off{font-size:clamp(16px,4.5vw,20px)}
.up{color:var(--up);text-shadow:0 0 32px rgba(255,77,109,.6)}.down{color:var(--down);text-shadow:0 0 32px rgba(46,230,166,.6)}
.off{color:var(--off)}
.bar{height:12px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;margin:12px 0}
.bar>div{height:100%;background:linear-gradient(90deg,#22D3EE,#7C5CFF,#FF4D8D)}
.glass.warn{border-color:var(--amber)}.warntxt{color:var(--amber);font-size:14px}
.item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.item:last-child{border:0}
#img img{width:220px;border-radius:16px;margin-top:14px}
a{color:#22D3EE}
@media (max-width:700px){.orb{animation:none;filter:blur(60px);opacity:.4}.glass{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(20,20,40,.85)}}
@media (prefers-reduced-motion:reduce){.orb{animation:none}.drop.err{animation:none}}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:rgba(20,20,40,.85)}}
</style></head><body>
<div class="bg"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div></div>
<main>
<section id="upload">
 <h1>你的錢，其實每年<wbr>縮水多少？</h1><p class="sub">用你自己的發票，算出真正的體感通膨。</p>
 <span class="pill">🔒 資料只在你的瀏覽器裡計算，不會上傳</span>
 <label class="glass drop" id="drop"><input type="file" id="file" accept=".csv,.txt" hidden>
  <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="url(#gr)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><defs><linearGradient id="gr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7C5CFF"/><stop offset="1" stop-color="#22D3EE"/></linearGradient></defs><path d="M12 15V4M7 9l5-5 5 5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg><div style="font-size:18px;margin:8px 0">拖放或點選手機條碼載具的消費明細檔（CSV）</div>
  <div class="sub" style="font-size:14px">需要的欄位：日期、品名、金額</div><div class="errmsg" id="err"></div></label>
 <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
  <button class="btn" id="demo">用範例資料試試</button>
  <div class="sub">官方 CPI 年增率 <input id="cpi" type="number" step="0.01"> %<div style="font-size:12px;margin-top:4px">請填主計總處最新公布值</div></div>
 </div>
 <p class="sub" style="font-size:12px">範例資料為虛構。</p>
 <div class="steps" id="steps"><div class="glass"><b>01</b>匯出載具消費明細</div><div class="glass"><b>02</b>比對同一商品前後的單價</div><div class="glass"><b>03</b>算出你的通膨和投資門檻</div></div>
</section>
<section id="out"></section>
</main>
<script>
const $=s=>document.querySelector(s);
function parseCSV(t){return t.replace(/^\uFEFF/,'').split(/\r?\n/).filter(l=>l.trim()).map(l=>{const r=[];let c='',q=false;for(const ch of l){if(ch=='"')q=!q;else if((ch==','||ch=='|')&&!q){r.push(c.trim());c=''}else c+=ch}r.push(c.trim());return r})}
function findCol(h,keys){return h.findIndex(x=>keys.some(k=>x.includes(k)))}
function toDate(s){s=s.replace(/[\/.]/g,'-');let m=s.match(/^(\d{3,4})-?(\d{2})-?(\d{2})/);if(!m)return null;let y=+m[1];if(y<1911)y+=1911;return new Date(y,+m[2]-1,+m[3])}
function norm(n){n=n.normalize('NFKC').toLowerCase().replace(/\s+/g,'');n=n.replace(/鮮奶/g,'鮮乳').replace(/(\d+(?:\.\d+)?)(毫升|ml|cc)/g,'$1ml').replace(/(\d+(?:\.\d+)?)(公升|l)(?![a-z])/g,(m,x)=>Math.round(x*1000)+'ml').replace(/(\d+(?:\.\d+)?)(公克|克|g)(?![a-z])/g,'$1g');n=n.replace(/(\d{2,4})$/,'$1ml');return n}
function fail(msg){const d=$('#drop');d.classList.remove('err');void d.offsetWidth;d.classList.add('err');$('#err').textContent=msg;$('#out').innerHTML=''}
const fmt=x=>(x>=0?'+':'')+x.toFixed(1)+'%';
function analyze(rows){
 $('#err').textContent='';$('#drop').classList.remove('err');
 const h=rows[0]||[];const di=findCol(h,['日期']),ni=findCol(h,['品名','品項','商品']),ai=findCol(h,['金額','小計','價格']),qi=findCol(h,['數量']);
 if(di<0||ni<0||ai<0)return fail('找不到「日期、品名、金額」欄位。請到財政部電子發票平台重新匯出消費明細，並確認第一列是欄位名稱。');
 const items=[];for(const r of rows.slice(1)){const d=toDate(r[di]||''),a=parseFloat((r[ai]||'').replace(/,/g,'')),q=qi>=0?parseFloat(r[qi])||1:1;if(d&&a>0&&r[ni])items.push({d,n:norm(r[ni]),raw:r[ni].trim(),p:a/q,a})}
 if(!items.length)return fail('檔案裡沒有讀到有效的消費紀錄，請確認日期和金額格式。');
 items.sort((x,y)=>x.d-y.d);const t0=items[0].d,t1=items[items.length-1].d,mid=new Date((+t0+ +t1)/2);
 const g={};for(const it of items){(g[it.n]??={e:[],l:[],s:0,raw:it.raw});g[it.n].s+=it.a;(it.d<mid?g[it.n].e:g[it.n].l).push(it.p)}
 const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;let W=0,S=0;const list=[];
 for(const v of Object.values(g)){if(v.e.length&&v.l.length){const ch=avg(v.l)/avg(v.e)-1;list.push({n:v.raw,ch,s:v.s});W+=v.s;S+=v.s*ch}}
 if(!list.length)return fail('這段期間沒有重複購買的品項。請上傳至少兩、三個月以上的明細，才能比較同一樣東西的價格變化。');
 const years=Math.max((t1-t0)/(365.25*864e5)/2,1/12);const annual=(Math.pow(1+S/W,1/years)-1)*100;
 const total=items.reduce((x,y)=>x+y.a,0),cov=W/total*100,cpi=parseFloat($('#cpi').value),low=cov<50;
 list.sort((a,b)=>b.ch-a.ch);const cls=annual>=0?'up':'down';
 const cmp=isNaN(cpi)?'在上方填入官方 CPI，就能看到你和官方的差距':`官方 ${fmt(cpi)}，你比官方${annual>cpi?'高':'低'} ${Math.abs(annual-cpi).toFixed(1)} 個百分點`;
 $('#out').innerHTML=`<div class="hero"><div class="sub" style="font-size:20px">我的體感通膨</div><div class="num ${cls}">${fmt(annual)}</div><div class="off" style="margin-top:12px">${cmp}</div><div class="sub" style="margin-top:40px">↓ 往下看細節</div></div>
 <div class="glass ${low?'warn':''}"><b>可信度</b><div class="bar"><div style="width:${cov.toFixed(0)}%"></div></div>這次有 <span class="num">${cov.toFixed(0)}%</span> 的消費成功比對到前後價格${low?'<div class="warntxt">⚠ 比對比例偏低，結果僅供參考。上傳更長期間的明細會更準。</div>':''}</div>
 <div class="glass"><b>漲最多的前五名</b><div class="sub" style="font-size:13px;margin-bottom:6px">${t0.toLocaleDateString()} 到 ${t1.toLocaleDateString()}，前後兩段期間的平均單價比較</div>${list.slice(0,5).map(x=>`<div class="item"><span>${x.n}</span><span class="num ${x.ch>=0?'up':'down'}">${fmt(x.ch*100)}</span></div>`).join('')}</div>
 <div class="glass"><b>投資門檻</b><div class="num" style="font-size:48px">${Math.max(annual,0).toFixed(1)}%</div><div class="sub">你的投資年報酬至少要這麼多，錢才沒有實際縮水。</div></div>
 <div class="glass" style="text-align:center"><button class="btn primary" id="share">產生分享圖卡</button><div id="img"></div></div>`;
 $('#share').onclick=()=>shareCard(annual,cpi);
 $('#out').scrollIntoView({behavior:'smooth'});
}
async function shareCard(annual,cpi){
 try{await Promise.all(['700 260px "Space Grotesk"','700 64px "Noto Sans TC"','400 56px "Noto Sans TC", sans-serif'].map(f=>document.fonts.load(f)))}catch(e){}
 const c=document.createElement('canvas');c.width=1080;c.height=1920;const x=c.getContext('2d');
 x.fillStyle='#0B0B1A';x.fillRect(0,0,1080,1920);x.filter='blur(120px)';
 [['#7C5CFF',200,350,420],['#FF4D8D',900,1500,460],['#22D3EE',600,900,300]].forEach(([col,cx,cy,r])=>{x.globalAlpha=.6;x.fillStyle=col;x.beginPath();x.arc(cx,cy,r,0,7);x.fill()});
 x.filter='none';x.globalAlpha=1;x.textAlign='center';x.fillStyle='#EEF';
 x.font='700 64px "Noto Sans TC"';x.fillText('我的體感通膨',540,760);
 const col=annual>=0?'#FF4D6D':'#2EE6A6';x.shadowColor=col;x.shadowBlur=60;x.fillStyle=col;x.font='700 260px "Space Grotesk", "Noto Sans TC", sans-serif';x.fillText(fmt(annual),540,1040);
 x.shadowBlur=0;x.fillStyle='#94A3B8';x.font='400 56px "Noto Sans TC", sans-serif';if(!isNaN(cpi))x.fillText('官方 CPI '+fmt(cpi),540,1180);
 x.fillStyle='#EEF';x.font='700 44px "Noto Sans TC"';x.fillText('體感通膨儀表板',540,1780);
 const u=c.toDataURL();$('#img').innerHTML=`<img src="${u}"><br><a download="my-inflation.png" href="${u}">下載圖卡</a>`;
}
let last=null;const run=()=>last&&analyze(last);
function load(f){const r=new FileReader();r.onload=()=>{last=parseCSV(r.result);run()};r.readAsText(f)}
$('#file').onchange=e=>e.target.files[0]&&load(e.target.files[0]);
const d=$('#drop');d.ondragover=e=>{e.preventDefault();d.classList.add('over')};d.ondragleave=()=>d.classList.remove('over');d.ondrop=e=>{e.preventDefault();d.classList.remove('over');e.dataTransfer.files[0]&&load(e.dataTransfer.files[0])};
$('#cpi').oninput=run;
$('#demo').onclick=()=>{const P=[['鮮奶 936ml',95,0.12],['雞蛋 10入',68,0.18],['便當',85,0.10],['美式咖啡',45,0.05],['吐司',42,0.08],['衛生紙',189,0.03],['礦泉水',20,0],['香蕉',35,0.15]];
 const rows=[['發票日期','品名','數量','金額']];for(let m=0;m<12;m++)for(const[n,p,inc]of P){const dt=new Date(2025,10+m,1+((n.length*3+m)%27));rows.push([`${dt.getFullYear()}/${String(dt.getMonth()+1).padStart(2,'0')}/${String(dt.getDate()).padStart(2,'0')}`,n,'1',String(Math.round(p*(1+inc*m/11)))])}
 last=rows;run()};
</script></body></html>
